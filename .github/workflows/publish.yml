name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotNetWind.slnx

      - name: Test
        run: dotnet test DotNetWind.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack src/DotNetWind.Cli/DotNetWind.Cli.csproj -c Release

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: Bubenshi

      - name: Push to NuGet.org
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
