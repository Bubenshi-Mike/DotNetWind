name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history (not the default shallow clone) - Directory.Build.props derives the package
      # version from the count of "Merge pull request" commits via
      # `git rev-list --count --merges --grep=...`, which needs the whole history to be accurate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotNetWind.slnx

      - name: Test
        run: dotnet test DotNetWind.slnx -c Release --no-restore
